spring.application.name=onboarding-tracker
server.port=8080

# Embedded H2, file based. The location can be overridden with the DB_URL environment variable.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/onboardingdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Logging configuration (replaces log4j.properties, now using SLF4J + Logback)
logging.level.root=INFO
logging.level.com.example.onboarding=INFO
logging.pattern.console=%d{ISO8601} %-5p [%c{1}] %m%n

